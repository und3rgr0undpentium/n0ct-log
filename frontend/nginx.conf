server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — every unknown path falls back to index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed assets
    location /static/ {
        expires 30d;
        access_log off;
    }
}
